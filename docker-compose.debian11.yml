# Docker Compose override for BASE-2 candidate testing.
#
# Swaps the tidal-connect service to build from the Debian-11 + vendored-
# Debian-9-libs candidate Dockerfile instead of pulling the production
# image from Docker Hub. Everything else — forwarder-arecord,
# forwarder-ffmpeg, network, env, volumes — is inherited from
# docker-compose.yml.
#
# Usage on tidal-dev (or any deployment host with this repo checked out):
#
#   # Build + start (uses BASE-2 candidate for tidal-connect):
#   docker compose -f docker-compose.yml -f docker-compose.debian11.yml \
#       --profile arecord up -d --build
#
#   # Check tidal-connect image content:
#   docker inspect tidal-connect --format '{{.Config.Image}}'
#     -> tidal-connect:base2-candidate
#
#   # Revert to production Docker Hub image — just drop the -f override:
#   docker compose down
#   docker compose --profile arecord up -d
#
# Background: docs/troubleshooting.md § "BASE-2: Debian 11 + vendored
# Debian-9 libs (validated)" — CI-validated but not yet cut over in
# production. This override is the safe way to smoke-test on real
# deployment hardware before deciding to promote.

services:
  tidal-connect:
    # Locally-tagged image so `docker compose build` does NOT overwrite
    # or push to the moskakos/tidal-connect Docker Hub tag.
    image: tidal-connect:base2-candidate
    build:
      context: tidal-connect
      dockerfile: Dockerfile.debian11-vendored
