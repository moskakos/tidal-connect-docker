# Docker Compose override for BASE-2 candidate testing.
#
# Swaps the tidal-connect service to pull the Debian-11 + vendored-
# Debian-9-libs candidate image from GHCR instead of the production
# Docker Hub image. Everything else — forwarder-arecord, forwarder-
# ffmpeg, network, env, volumes — is inherited from docker-compose.yml.
#
# Usage on tidal-dev (or any deployment host with this repo checked out):
#
#   # Pull the CI-published image + start (~30 s vs. 5-10 min local build):
#   docker compose -f docker-compose.yml -f docker-compose.debian11.yml \
#       --profile arecord pull tidal-connect
#   docker compose -f docker-compose.yml -f docker-compose.debian11.yml \
#       --profile arecord up -d
#
#   # Check which image is running:
#   docker inspect tidal-connect --format '{{.Config.Image}}'
#     -> ghcr.io/moskakos/tidal-connect:base2-candidate
#
#   # Revert to production Docker Hub image — just drop the -f override:
#   docker compose down
#   docker compose --profile arecord up -d
#
# The image is (re-)published by CI on every push to
# feat/base-2-debian11-vendored. See .github/workflows/ci.yml
# ('Push candidate to GHCR' step) and TODO.md MISC-2 (cleanup task).
#
# Background: docs/troubleshooting.md § "BASE-2: Debian 11 + vendored
# Debian-9 libs (validated)" — CI-validated but not yet cut over in
# production. This override is the safe way to smoke-test on real
# deployment hardware before deciding to promote.

services:
  tidal-connect:
    # BASE-2 candidate image published by CI to GHCR after every push to
    # feat/base-2-debian11-vendored. See the 'Push candidate to GHCR' step
    # in .github/workflows/ci.yml. `docker compose pull` on the deployment
    # host fetches the latest CI-validated build (~30 s), skipping the
    # slow QEMU rebuild on tidal-dev (~5-10 min).
    image: ghcr.io/moskakos/tidal-connect:base2-candidate
